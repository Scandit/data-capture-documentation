name: Build Documentation

on:
  pull_request:
    branches:
      - main
      - 'release/**'
  push:
    branches:
      - main

jobs:
  build:
    name: Build Docusaurus Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build documentation
        run: yarn build

      # The versioned API reference publishes the same page under several URLs
      # and declares no canonical form, so Google picks one - often the oldest.
      # Warns for now: the API-reference HTML is generated outside this repo, so
      # this cannot pass until that generator emits canonical/noindex. Add
      # --strict to make it blocking once it does.
      - name: Verify API-reference canonical tags
        run: yarn verify:api-reference-seo
