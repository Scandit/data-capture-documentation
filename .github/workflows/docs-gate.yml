name: Docs Quality Gate

# Runs the docs quality gate (Vale/Google style, cspell, frontmatter schema,
# link check) on every PR. The gate ratchets to the docs CHANGED in the PR
# (git merge-base origin/main HEAD), so it never blocks on pre-existing legacy
# pages — only new or modified docs must pass.

on:
  pull_request:
    branches:
      - main
      - 'release/**'

jobs:
  docs-gate:
    name: Docs Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history so the gate's `git merge-base origin/main HEAD`
          # ratchet can diff the PR against main.
          fetch-depth: 0

      - name: Ensure origin/main is available for the ratchet
        run: git fetch --no-tags origin main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Set up Vale
        run: yarn docs:gate:setup

      - name: Run docs quality gate
        run: yarn docs:gate
